name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Smoke test (no broker, HTTP ingest)
        shell: bash
        run: |
          python -m mqttdash &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz >/dev/null && break
            sleep 1
          done
          python -m mqttdash.sim --devices 2 --rate 4 --duration 3
          curl -sf http://127.0.0.1:8000/api/stats
          curl -sf "http://127.0.0.1:8000/api/series?device=dev-01&metric=temp&window=600&bucket=10"
          kill $SERVER_PID
